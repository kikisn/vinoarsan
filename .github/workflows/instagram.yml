name: Fetch Instagram Posts

on:
  workflow_dispatch:
  push:
    branches: [redesign-tropical, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install instaloader

      # ✅ CREATE INSTALOADER DIRECTORY AND RESTORE SESSION
      - name: Restore Instagram session
        run: |
          mkdir -p /tmp/.instaloader-runner
          echo "${{ secrets.INSTAGRAM_SESSION_B64 }}" | base64 --decode > /tmp/.instaloader-runner/session-vino.arsan

      # ✅ NOW FETCH POSTS
      - name: Fetch Instagram posts
        run: python scripts/fetch_instagram.py

      - name: Commit updated posts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posts.json
          git commit -m "Update Instagram posts" || echo "No changes"
          git push